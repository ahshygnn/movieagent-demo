services:
  - type: web
    name: movieagent-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm --prefix movieagent-live-frontend ci && npm --prefix movieagent-live-frontend run build && npm --prefix movieagent-mobile-frontend ci && npm --prefix movieagent-mobile-frontend run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ARK_API_KEY
        sync: false
      - key: YIZHAN_API_KEY
        sync: false
      - key: YIZHAN_BASE_URL
        value: https://vip.yi-zhan.top/v1/
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: CHARACTER_IMAGE_SIZE
        value: 2048x2048
      - key: ENABLE_DUBBING
        value: true
      - key: VIDEO_DURATION_SECONDS
        value: 5
      - key: VIDEO_MAX_CONCURRENCY
        value: 2
